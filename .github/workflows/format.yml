name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  air:
    name: R (Air)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: posit-dev/setup-air@v1
      - run: air format . --check

  ruff:
    name: Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check --diff
